name: Daily Portfolio Alert v4.0

"on":
  schedule:
    - cron: '0 0 * * 1-5'  # 평일 오전 9시 (KST)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance requests pandas numpy
      - run: python portfolio_alert.py
      - name: Commit phase_state.json
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add phase_state.json
          git diff --staged --quiet || git commit -m "chore: update phase_state.json [skip ci]"
          git push
